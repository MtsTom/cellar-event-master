<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pago simulado | Cellar Event Master</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="reservation-page payment-page">
  <header class="main-header">
    <nav class="navbar">
      <a href="../index.html" class="logo">🍷 Cellar Event Master</a>
      <div class="nav-actions">
        <button id="back-button" class="secondary-button" type="button">Volver</button>
        <button id="logout-button" class="secondary-button" type="button">Cerrar sesión</button>
      </div>
    </nav>
  </header>

  <main class="reservation-main">
    <section class="reservation-heading">
      <span class="section-tag">Pago de demostración</span>
      <h1>Elegí el medio de pago</h1>
      <p>Este entorno es simulado. No se procesarán pagos ni datos bancarios reales.</p>
    </section>

    <section class="reservation-layout payment-layout">
      <article class="reservation-event-card">
        <div id="payment-loading" class="reservation-loading">Cargando resumen...</div>
        <div id="payment-summary" hidden>
          <span class="event-card-type">Resumen de compra</span>
          <h2 id="payment-event-name">Evento</h2>
          <div class="reservation-event-details">
            <p><strong>Fecha:</strong> <span id="payment-event-date">-</span></p>
            <p><strong>Hora:</strong> <span id="payment-event-time">-</span></p>
            <p><strong>Ubicación:</strong> <span id="payment-event-location">-</span></p>
            <p><strong>Personas:</strong> <span id="payment-people">-</span></p>
            <p><strong>Precio unitario:</strong> <span id="payment-unit-price">-</span></p>
          </div>
          <div class="reservation-total payment-total">
            <span>Total</span>
            <strong id="payment-total">$ 0</strong>
          </div>
        </div>
      </article>

      <aside class="reservation-summary-card">
        <h2>Medio de pago</h2>
        <form id="payment-form">
          <div class="payment-methods">
            <label class="payment-method-option">
              <input type="radio" name="paymentMethod" value="tarjeta" checked />
              <span><strong>Tarjeta</strong><small>Crédito o débito · simulación</small></span>
            </label>
            <label class="payment-method-option">
              <input type="radio" name="paymentMethod" value="transferencia" />
              <span><strong>Transferencia</strong><small>Pago aprobado de forma simulada</small></span>
            </label>
            <label class="payment-method-option">
              <input type="radio" name="paymentMethod" value="efectivo" />
              <span><strong>Efectivo en el lugar</strong><small>Reserva confirmada para la demostración</small></span>
            </label>
          </div>

          <div id="card-demo-fields" class="card-demo-fields">
            <div class="form-group">
              <label for="demo-card-number">Número de tarjeta ficticio</label>
              <input id="demo-card-number" type="text" value="4242 4242 4242 4242" readonly />
            </div>
            <div class="payment-demo-row">
              <div class="form-group">
                <label for="demo-expiration">Vencimiento</label>
                <input id="demo-expiration" type="text" value="12/30" readonly />
              </div>
              <div class="form-group">
                <label for="demo-code">Código</label>
                <input id="demo-code" type="text" value="123" readonly />
              </div>
            </div>
          </div>

          <p id="payment-message" class="form-message" hidden></p>
          <button id="confirm-payment-button" class="primary-button" type="submit">Confirmar pago y reservar</button>
        </form>
      </aside>
    </section>
  </main>

  <script src="../js/auth.js"></script>
  <script src="../js/payment.js"></script>
</body>
</html>
